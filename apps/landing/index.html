<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="HELIX Project" />
    <meta name="google-site-verification" content="d2ea5c11894633c0" />
    <link rel="canonical" href="https://helix-assistant.vercel.app/" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://helix-assistant.vercel.app/" />
    <meta property="og:title" content="HELIX - AI Desktop Assistant for Windows" />
    <meta property="og:description" content="Persistent AI computer agent for Windows. Local-first model routing, on-demand vision, and zero-trust desktop tooling." />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://helix-assistant.vercel.app/" />
    <meta property="twitter:title" content="HELIX - AI Desktop Assistant for Windows" />
    <meta property="twitter:description" content="Persistent AI computer agent for Windows. Local-first model routing, on-demand vision, and zero-trust desktop tooling." />
    <meta property="twitter:image" content="https://helix-assistant.vercel.app/favicon.svg" />

    <!-- Structured Data (JSON-LD) for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "HELIX",
      "operatingSystem": "Windows 10, Windows 11",
      "applicationCategory": "BusinessApplication, DeveloperApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Persistent desktop AI agent for Windows with voice, screen context, and zero-trust execution.",
      "url": "https://helix-assistant.vercel.app/"
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <!-- Google Translate auto-detect widget -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: true,
          layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL,
          multilanguagePage: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Hide Google Translate bar and style the widget minimally -->
    <style>
      .goog-te-banner-frame { display: none !important; }
      body { top: 0 !important; }
      #google_translate_element {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 9999;
        background: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 12px;
      }
      #google_translate_element .goog-te-gadget {
        font-size: 0;
        color: transparent;
      }
      #google_translate_element .goog-te-gadget > span {
        display: none !important;
      }
      #google_translate_element select.goog-te-combo {
        background: transparent;
        color: #ccc;
        border: none;
        font-size: 12px;
        font-family: 'Inter', sans-serif;
        outline: none;
        cursor: pointer;
        padding: 2px 4px;
      }
      .goog-te-gadget-icon { display: none !important; }
      .goog-tooltip, .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
    </style>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
