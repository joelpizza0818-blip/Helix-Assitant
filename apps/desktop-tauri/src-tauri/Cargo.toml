[package]
name = "helix-desktop-tauri"
version = "0.1.9"
description = "HELIX Lite desktop shell"
authors = ["HELIX Team"]
edition = "2021"

[lib]
name = "helix_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.1", features = ["tray-icon"] }
