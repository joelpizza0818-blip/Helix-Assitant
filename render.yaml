services:
  - type: web
    name: helix-assistant-api
    runtime: node
    plan: free
    buildCommand: >-
      npm ci --include=dev &&
      node -e "const fs=require('fs');const p='server/tsconfig.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.compilerOptions.module='Node16';c.compilerOptions.moduleResolution='Node16';fs.writeFileSync(p,JSON.stringify(c,null,2))" &&
      npm run build --workspace=@helix/server
    startCommand: npm run start --workspace=@helix/server
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://helix-assistant.vercel.app,null
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
