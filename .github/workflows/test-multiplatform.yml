name: Test Multiplataforma

on:
  push:
    branches: [main, dev]
    paths:
      - 'services/agent/**'
      - 'config/**'
      - 'Dockerfile.test-linux'
      - '.github/workflows/test-multiplatform.yml'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/agent/**'
      - 'config/**'
      - 'Dockerfile.test-linux'
      - '.github/workflows/test-multiplatform.yml'
      - 'tests/**'

jobs:
  test-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: services/agent/requirements.txt
          - os: ubuntu-latest
            requirements: services/agent/requirements-linux.txt
          - os: macos-latest
            requirements: services/agent/requirements-linux.txt

    runs-on: ${{ matrix.os }}
    name: Tests — ${{ matrix.os }}${{ matrix.os == 'ubuntu-latest' && ' (Docker)' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Prepare test report directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Run Linux tests in Docker
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -f Dockerfile.test-linux -t helix-test-linux .
          docker run --rm \
            -v "$PWD/services/agent:/app/services/agent" \
            -v "$PWD/apps:/app/apps" \
            -v "$PWD/.github:/app/.github" \
            -v "$PWD/config:/app/config" \
            -v "$PWD/test-results:/app/test-results" \
            -e DISPLAY=:99 \
            helix-test-linux \
            sh -c "Xvfb :99 -screen 0 1024x768x24 -ac & sleep 1 && python -m pytest services/agent/tests/ -v --tb=short --junitxml=/app/test-results/agent-linux.xml"

      - name: Install Python dependencies on Windows and macOS
        if: matrix.os != 'ubuntu-latest'
        run: pip install -r ${{ matrix.requirements }}

      - name: Run native Windows and macOS tests
        if: matrix.os != 'ubuntu-latest'
        env:
          PYTHONPATH: .
        run: python -m pytest services/agent/tests/ -v --tb=short --junitxml=test-results/agent-${{ runner.os }}.xml

      - name: Upload platform test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-tests-${{ runner.os }}
          path: test-results/agent-*.xml
          if-no-files-found: warn
