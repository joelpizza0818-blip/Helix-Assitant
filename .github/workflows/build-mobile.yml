name: Build HELIX Mobile

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android release package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - name: Check out HELIX
        uses: actions/checkout@v4

      - name: Validate mobile release tag
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          release_version="$(awk '/^version:/ { gsub(/"/, "", $2); print $2; exit }' pubspec.yaml)"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[1-9][0-9]*)?$ ]]; then
            echo "::error::Invalid mobile version in movil/pubspec.yaml: $release_version"
            exit 1
          fi
          version="${release_version%%+*}"
          build_number="${release_version##*+}"
          if [[ "$release_version" != *+* || ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android releases require an increasing build number in pubspec.yaml."
            exit 1
          fi
          expected_tag="mobile-v$version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $expected_tag."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter to use Java 17
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Analyze mobile client
        run: flutter analyze

      - name: Test mobile client
        run: flutter test

      - name: Inject Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_B64" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
              echo "::error::Android signing secrets are required for a mobile release."
              exit 1
            fi
            echo "::notice::No Android signing keystore configured; manual build will use debug signing."
            exit 0
          fi

          set -euo pipefail
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_STORE_PASSWORD:?Missing ANDROID_STORE_PASSWORD secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/helix-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=helix-release.jks\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify Android APK signing certificate
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_STORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
              echo "::error::Android signing secrets are required to verify a mobile release."
              exit 1
            fi
            echo "::notice::Skipping distribution certificate comparison for a debug-only manual build."
            exit 0
          fi

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::Android SDK path is unavailable; cannot verify APK signature."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android SDK apksigner was not found."
            exit 1
          fi

          apk="build/app/outputs/flutter-apk/app-release.apk"
          expected_fingerprint="$(keytool -exportcert -alias "$ANDROID_KEY_ALIAS" -keystore android/helix-release.jks -storepass:env ANDROID_STORE_PASSWORD | openssl dgst -sha256 | awk '{print tolower($NF)}')"
          signer_info="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
          actual_fingerprint="$(printf '%s\n' "$signer_info" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          if [[ -z "$expected_fingerprint" || -z "$actual_fingerprint" || "$expected_fingerprint" != "$actual_fingerprint" ]]; then
            echo "::error::APK signing certificate does not match the configured Android keystore."
            echo "Expected certificate SHA-256: $expected_fingerprint"
            echo "APK signer certificate SHA-256: $actual_fingerprint"
            if [[ -z "$actual_fingerprint" ]]; then
              printf '%s\n' "$signer_info"
            fi
            exit 1
          fi
          echo "Verified APK signer certificate SHA-256: $actual_fingerprint"

      - name: Prepare Android Release Asset
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HELIX-Mobile.apk
          sha256sum HELIX-Mobile.apk > HELIX-Mobile.apk.sha256
          sha256sum --check HELIX-Mobile.apk.sha256

      - name: Publish Android release assets
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: HELIX Mobile ${{ github.ref_name }}
          body: |
            ### HELIX Mobile ${{ github.ref_name }}

            ${{ secrets.ANDROID_KEYSTORE_B64 != '' && '✅ APK firmado con clave de distribución oficial de HELIX.' || '⚠️ APK firmado con clave debug (sin firma oficial de distribución).' }}

            Se adjunta `HELIX-Mobile.apk.sha256` para verificar la integridad del archivo descargado.

            > No instales sobre una versión firmada con una clave diferente.
          prerelease: false
          files: |
            movil/HELIX-Mobile.apk
            movil/HELIX-Mobile.apk.sha256

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-mobile-android-test
          path: |
            movil/HELIX-Mobile.apk
            movil/HELIX-Mobile.apk.sha256
          if-no-files-found: error
          retention-days: 30
